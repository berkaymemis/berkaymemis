    </text>
    <text x="180" y="8" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#00f5d4">
      [0–85+ PROJECTION]
    </text>
    
    <line x1="-25" y1="18" x2="285" y2="18" stroke="#1e293b" stroke-width="1" />

    <!-- Central Axis (Age Axis) -->
    <line x1="130" y1="28" x2="130" y2="195" stroke="#475569" stroke-width="1" stroke-dasharray="2 3" />
    <text x="118" y="210" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" fill="#64748b">AGE</text>
    <text x="45" y="210" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" fill="#38bdf8">MALE</text>
    <text x="195" y="210" font-family="'JetBrains Mono', Consolas, monospace" font-size="8" fill="#f43f5e">FEMALE</text>

    <!-- Animated Age Cohort Bars (Top: 80+, Middle: 40-44, Bottom: 0-4) -->
    <!-- Cohort 80+ -->
    <rect x="110" y="32" width="18" height="8" rx="2" fill="#38bdf8" opacity="0.8">
      <animate attributeName="width" values="18;26;18" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="110;102;110" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="32" width="22" height="8" rx="2" fill="#f43f5e" opacity="0.8">
      <animate attributeName="width" values="22;32;22" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 70-74 -->
    <rect x="95" y="46" width="33" height="8" rx="2" fill="#38bdf8" opacity="0.85">
      <animate attributeName="width" values="33;45;33" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="95;83;95" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="46" width="38" height="8" rx="2" fill="#f43f5e" opacity="0.85">
      <animate attributeName="width" values="38;52;38" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 60-64 -->
    <rect x="75" y="60" width="53" height="8" rx="2" fill="#38bdf8" opacity="0.9">
      <animate attributeName="width" values="53;68;53" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="75;60;75" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="60" width="58" height="8" rx="2" fill="#f43f5e" opacity="0.9">
      <animate attributeName="width" values="58;74;58" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 50-54 -->
    <rect x="60" y="74" width="68" height="8" rx="2" fill="#38bdf8" opacity="0.95">
      <animate attributeName="width" values="68;82;68" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="60;46;60" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="74" width="72" height="8" rx="2" fill="#f43f5e" opacity="0.95">
      <animate attributeName="width" values="72;88;72" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 40-44 (Bulk Work Force) -->
    <rect x="42" y="88" width="86" height="8" rx="2" fill="url(#neonTeal)">
      <animate attributeName="width" values="86;98;86" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="42;30;42" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="88" width="90" height="8" rx="2" fill="url(#neonViolet)">
      <animate attributeName="width" values="90;104;90" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 30-34 -->
    <rect x="50" y="102" width="78" height="8" rx="2" fill="url(#neonTeal)">
      <animate attributeName="width" values="78;90;78" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="50;38;50" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="102" width="82" height="8" rx="2" fill="url(#neonViolet)">
      <animate attributeName="width" values="82;95;82" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 20-24 -->
    <rect x="65" y="116" width="63" height="8" rx="2" fill="#38bdf8" opacity="0.9">
      <animate attributeName="width" values="63;75;63" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="65;53;65" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="116" width="66" height="8" rx="2" fill="#f43f5e" opacity="0.9">
      <animate attributeName="width" values="66;78;66" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 10-14 -->
    <rect x="80" y="130" width="48" height="8" rx="2" fill="#38bdf8" opacity="0.85">
      <animate attributeName="width" values="48;58;48" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="80;70;80" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="130" width="50" height="8" rx="2" fill="#f43f5e" opacity="0.85">
      <animate attributeName="width" values="50;62;50" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Cohort 0-4 (Base) -->
    <rect x="90" y="144" width="38" height="8" rx="2" fill="#38bdf8" opacity="0.8">
      <animate attributeName="width" values="38;48;38" dur="6s" repeatCount="indefinite" />
      <animate attributeName="x" values="90;80;90" dur="6s" repeatCount="indefinite" />
    </rect>
    <rect x="132" y="144" width="40" height="8" rx="2" fill="#f43f5e" opacity="0.8">
      <animate attributeName="width" values="40;52;40" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- Curve Trace Line for Survival Simulation -->
    <path d="M 110 36 Q 40 92 90 148" fill="none" stroke="#00f5d4" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75" />
    <path d="M 154 36 Q 225 92 172 148" fill="none" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.75" />
  </g>

  <!-- 5. Rotating Analytical Diagnostic Modules (Bottom HUD) -->
  <!-- Card 1: Kent Öngörü Core -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.02;0.23;0.25;1" dur="20s" repeatCount="indefinite" />
    <rect x="35" y="340" width="420" height="54" rx="8" fill="#0d1527" fill-opacity="0.9" stroke="#00f5d4" stroke-width="1" />
    <rect x="35" y="340" width="4" height="54" rx="2" fill="#00f5d4" />
    <text x="50" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">
      KENT ÖNGÖRÜ // QGIS HUB #6775
    </text>
    <text x="50" y="380" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      Official multi-scenario demographic &amp; disaster forecasting suite
    </text>
  </g>

  <!-- Card 2: Cohort Component Engine -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.27;0.48;0.50;1" dur="20s" repeatCount="indefinite" />
    <rect x="35" y="340" width="420" height="54" rx="8" fill="#0d1527" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    <rect x="35" y="340" width="4" height="54" rx="2" fill="#38bdf8" />
    <text x="50" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">
      COHORT-COMPONENT ENGINE
    </text>
    <text x="50" y="380" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      0–85+ age brackets · ASFR fertility matrices · Survival curves
    </text>
  </g>

  <!-- Card 3: CDVI Hazard Assessment -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.52;0.73;0.75;1" dur="20s" repeatCount="indefinite" />
    <rect x="35" y="340" width="420" height="54" rx="8" fill="#0d1527" fill-opacity="0.9" stroke="#f43f5e" stroke-width="1" />
    <rect x="35" y="340" width="4" height="54" rx="2" fill="#f43f5e" />
    <text x="50" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">
      CDVI // COMPOSITE DISASTER RISK
    </text>
    <text x="50" y="380" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      Structural &amp; demographic vulnerability spatial index calculated
    </text>
  </g>

  <!-- Card 4: Dual Runtime Qt5 / Qt6 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.77;0.98;1.00;1" dur="20s" repeatCount="indefinite" />
    <rect x="35" y="340" width="420" height="54" rx="8" fill="#0d1527" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1" />
    <rect x="35" y="340" width="4" height="54" rx="2" fill="#8b5cf6" />
    <text x="50" y="361" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="700" fill="#f8fafc">
      DUAL RUNTIME // QT5 (QGIS 3) + QT6 (QGIS 4)
    </text>
    <text x="50" y="380" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
      Zero-dependency native OpenXML &amp; QPainter vector chart engines
    </text>
  </g>

  <!-- Live Telemetry Tag (Bottom Right) -->
  <g transform="translate(860, 352)">
    <circle cx="0" cy="0" r="4" fill="#00f5d4">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="12" y="4" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#00f5d4" letter-spacing="1">
      HEADLESS E2E CI/CD: VERIFIED
    </text>
    <text x="12" y="20" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5" fill="#64748b">
      DUAL RUNTIME: 3.44.14-LTR &amp; 4.2.3 PASS
    </text>
  </g>

  <!-- 6. Executive Identity (Top Left Branding) -->
  <rect x="25" y="45" width="440" height="110" rx="10" fill="#09101d" fill-opacity="0.82" stroke="#1e293b" stroke-width="1" />
  
  <text x="45" y="85" font-family="'Segoe UI', Inter, system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Berkay Memiş
  </text>
  
  <text x="46" y="112" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#00f5d4" letter-spacing="0.5">
    URBAN PLANNER &amp; SPATIAL SYSTEMS ENGINEER
  </text>
  
  <text x="46" y="132" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#94a3b8">
    Spatial Demographics · CDVI Disaster Risk · PyQGIS Systems Architect
  </text>

  <!-- Outer Card Tech Border -->
  <rect x="1" y="1" width="1198" height="418" rx="16" fill="none" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1.8" />
</g>
</svg>
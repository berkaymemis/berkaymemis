<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="berkayTitle berkayDesc">
<title id="berkayTitle">Berkay Memiş — Spatial Demographics, Disaster Vulnerability and PyQGIS Systems</title>
<desc id="berkayDesc">An animated computational spatial planning dashboard featuring a hexagonal GIS analytics grid, dynamic demographic cohort-component age pyramid, predictive urban growth isochrones, and Kent Öngörü architecture diagnostics.</desc>
<defs>
  <!-- Background Gradients -->
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#080c14" />
    <stop offset="50%" stop-color="#0d1527" />
    <stop offset="100%" stop-color="#050811" />
  </linearGradient>
  
  <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00f5d4" />
    <stop offset="100%" stop-color="#059669" />
  </linearGradient>

  <linearGradient id="neonRose" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#f43f5e" />
    <stop offset="100%" stop-color="#be123c" />
  </linearGradient>

  <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#8b5cf6" />
    <stop offset="100%" stop-color="#4f46e5" />
  </linearGradient>

  <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fbbf24" />
    <stop offset="100%" stop-color="#d97706" />
  </linearGradient>

  <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.25" />
    <stop offset="60%" stop-color="#00f5d4" stop-opacity="0.05" />
    <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
  </radialGradient>

  <!-- Card Clipping -->
  <clipPath id="cardClip">
    <rect x="0" y="0" width="1200" height="420" rx="16" />
  </clipPath>

  <!-- Filter for Neon Glow -->
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur" />
    <feComposite in="SourceGraphic" in2="blur" operator="over" />
  </filter>

  <!-- Hexagon Macro -->
  <polygon id="hex" points="0,-16 14,-8 14,8 0,16 -14,8 -14,-8" />
</defs>

<g clip-path="url(#cardClip)">
  <!-- 1. Deep Space GIS Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- 2. Coordinate Grid Lines & Crosshairs -->
  <g stroke="#1e293b" stroke-width="0.8" stroke-dasharray="3 6" opacity="0.65">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />

    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Crosshairs -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.35">
    <path d="M 195 140 H 205 M 200 135 V 145" />
    <path d="M 395 280 H 405 M 400 275 V 285" />
    <path d="M 595 140 H 605 M 600 135 V 145" />
    <path d="M 795 280 H 805 M 800 275 V 285" />
    <path d="M 995 140 H 1005 M 1000 135 V 145" />
  </g>

  <!-- Spatial Coordinates Watermark -->
  <text x="35" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#475569" letter-spacing="1.5">38°25'18"N 27°08'46"E // EPSG:4326 // SPATIAL ANALYTICS RUNTIME</text>
  <text x="1040" y="24" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" fill="#475569" letter-spacing="1.5">SYS.BUILD: 2026.Q4</text>

  <!-- 3. Hexagonal Urban Mesh (Center-Left: Urban Parcels with CDVI Analysis) -->
  <g transform="translate(420, 215)" opacity="0.85">
    <!-- Concentric Growth Isochrones (2030, 2045, 2060) -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#00f5d4" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="4 6">
      <animate attributeName="stroke-dashoffset" values="0;-80" dur="18s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="50" fill="url(#radarGlow)">
      <animate attributeName="r" values="45;65;45" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Radar Sweep Line -->
    <line x1="0" y1="0" x2="135" y2="0" stroke="#00f5d4" stroke-width="1.5" stroke-opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    </line>

    <!-- Hexagonal City Fabric -->
    <!-- Center Resilient Core -->
    <use href="#hex" x="0" y="0" fill="#00f5d4" fill-opacity="0.35" stroke="#00f5d4" stroke-width="1" />
    <use href="#hex" x="28" y="0" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="-28" y="0" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="14" y="24" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="-14" y="24" fill="#00f5d4" fill-opacity="0.25" stroke="#00f5d4" stroke-width="0.8" />
    <use href="#hex" x="14" y="-24" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="-14" y="-24" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Second Ring: CDVI Vulnerability Flags (Red/Amber) -->
    <use href="#hex" x="56" y="0" fill="#f43f5e" fill-opacity="0.45" stroke="#f43f5e" stroke-width="1.2">
      <animate attributeName="fill-opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite" />
    </use>
    <use href="#hex" x="42" y="24" fill="#f59e0b" fill-opacity="0.35" stroke="#f59e0b" stroke-width="0.8" />
    <use href="#hex" x="42" y="-24" fill="#00f5d4" fill-opacity="0.2" stroke="#00f5d4" stroke-width="0.8" />
    <use href="#hex" x="-56" y="0" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="-42" y="24" fill="#f43f5e" fill-opacity="0.4" stroke="#f43f5e" stroke-width="1">
      <animate attributeName="fill-opacity" values="0.2;0.55;0.2" dur="3.2s" repeatCount="indefinite" />
    </use>
    <use href="#hex" x="-42" y="-24" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="0.8" />

    <!-- Third Ring: Outskirts & Extension -->
    <use href="#hex" x="0" y="48" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="28" y="48" fill="#00f5d4" fill-opacity="0.25" stroke="#00f5d4" stroke-width="0.8" />
    <use href="#hex" x="-28" y="48" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="0" y="-48" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />
    <use href="#hex" x="28" y="-48" fill="#f59e0b" fill-opacity="0.25" stroke="#f59e0b" stroke-width="0.8" />
    <use href="#hex" x="-28" y="-48" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Pulse Beacon on CDVI Critical Point -->
    <circle cx="56" cy="0" r="3" fill="#f43f5e">
      <animate attributeName="r" values="2;5;2" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="56" cy="0" r="8" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.6">
      <animate attributeName="r" values="4;14;4" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.8s" repeatCount="indefinite" />
    </circle>

    <!-- Isochrone Horizon Tags -->
    <text x="100" y="-10" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#00f5d4" opacity="0.8">2045 HORIZON</text>
    <text x="-135" y="60" font-family="'JetBrains Mono', Consolas, monospace" font-size="9" fill="#38bdf8" opacity="0.7">15-MIN ISOCHRONE</text>
  </g>

  <!-- 4. Demographic Cohort-Component Age Pyramid (Right Center) -->
  <g transform="translate(860, 95)">
    <!-- Panel Header -->
    <rect x="-40" y="-15" width="340" height="240" rx="10" fill="#09101d" fill-opacity="0.75" stroke="#1e293b" stroke-width="1.2" />
    
    <text x="-25" y="8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">
